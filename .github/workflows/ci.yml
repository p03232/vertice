name: CI

on:
  push:
    branches: ["develop", "feature/**"]
  pull_request:
    branches: ["develop"]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Build the software and the unit tests
        run: make

  sast:
    name: SAST
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Semgrep
        run: pipx install semgrep==1.182.1
      - name: Run static analysis
        run: |
          # Semgrep discovers directory rules by their YAML extension.
          cp .semgrep/cpp-rules .semgrep/cpp-rules.yaml
          make sast

  dynamic-analysis:
    name: Dynamic Analysis
    needs: build
    runs-on: ubuntu-24.04
    env:
      PAYMENT_KEY: ${{ secrets.PAYMENT_KEY }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Configure address randomization for ASan
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Run ASan and UBSan
        run: make sanitizers
      - name: Run Valgrind
        if: ${{ !cancelled() }}
        run: make valgrind

  dast:
    name: DAST
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Run command-line regression cases
        run: make dast
